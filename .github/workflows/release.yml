name: Create Release Zip

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach zip to (e.g., v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # The same script the updater tester builds its zips with
      # (tests/tools/updater_e2e.sh), so the zip readers download is the zip
      # that was tested: scripts/build_release_zip.sh holds the exclude list
      # and, while scripts/release_shims.txt exists, writes the transitional
      # shims of the layout change.
      - name: Build the plugin zip
        run: |
          mkdir -p build
          sh scripts/build_release_zip.sh HEAD build/koassistant.koplugin.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/koassistant.koplugin.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
